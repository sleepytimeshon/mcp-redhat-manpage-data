---
name: CI

# Man pages are extracted on a subscribed RHEL host with scripts/extract.sh (GitHub-hosted
# runners cannot reach the RHEL repositories). This workflow validates the committed data
# and publishes it to npm when package.json carries a version that is not yet on npm.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate man pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check test/validate.mjs
          node --check test/api.mjs

      - name: Check script syntax
        run: |
          bash -n scripts/extract.sh scripts/pack.sh
          shellcheck scripts/extract.sh scripts/pack.sh

      - name: Validate man pages
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      # npm publish rewrites or drops package.json fields it considers invalid, so fail
      # here instead of shipping a broken package
      - name: Check package.json needs no npm fixes
        run: |
          npm pkg fix
          git diff --exit-code -- package.json

  publish:
    name: Publish to npm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the vX.Y.Z release
      id-token: write  # npm trusted publishing and provenance
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Check package.json needs no npm fixes
        run: |
          npm pkg fix
          git diff --exit-code -- package.json

      - name: Check whether this version is on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; bump the version in package.json to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Create release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
